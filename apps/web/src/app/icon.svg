<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b1d60"/>
      <stop offset="50%" stop-color="#24113d"/>
      <stop offset="100%" stop-color="#120822"/>
    </linearGradient>

    <!-- Star Glow Gradient -->
    <radialGradient id="starGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.8"/>
      <stop offset="40%" stop-color="#f59e0b" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>

    <!-- Main Gold Star Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="30%" stop-color="#fef08a"/>
      <stop offset="70%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Rim Light Gradient -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Shadow Filter -->
    <filter id="cozyShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.65"/>
      <feDropShadow dx="0" dy="0" stdDeviation="24" flood-color="#f59e0b" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="24" y="24" width="464" height="464" rx="128" fill="url(#bgGrad)"/>
  
  <!-- Outer Glow Border Rim -->
  <rect x="24" y="24" width="464" height="464" rx="128" fill="none" stroke="url(#rimGrad)" stroke-width="12"/>

  <!-- Soft Cosmic Glow Aura Behind Star -->
  <circle cx="256" cy="256" r="180" fill="url(#starGlow)"/>

  <!-- Tiny Twinkling Background Stars -->
  <circle cx="120" cy="130" r="8" fill="#fef08a" opacity="0.8"/>
  <circle cx="390" cy="140" r="6" fill="#fde047" opacity="0.75"/>
  <circle cx="110" cy="370" r="7" fill="#e9d5ff" opacity="0.7"/>
  <circle cx="390" cy="380" r="9" fill="#fef08a" opacity="0.85"/>

  <!-- Four-point Sparkle (Top Right) -->
  <path d="M370 180 Q370 195 385 195 Q370 195 370 210 Q370 195 355 195 Q370 195 370 180 Z" fill="#ffffff" opacity="0.9"/>
  <!-- Four-point Sparkle (Bottom Left) -->
  <path d="M140 300 Q140 312 152 312 Q140 312 140 324 Q140 312 128 312 Q140 312 140 300 Z" fill="#fef08a" opacity="0.85"/>

  <!-- Main Cozy Five-Point Chunky Cartoon Star -->
  <g filter="url(#cozyShadow)">
    <path d="M256 92 
             L294 190 
             Q302 210 322 214 
             L424 230 
             Q444 233 430 248 
             L356 322 
             Q342 336 345 356 
             L362 458 
             Q365 478 348 468 
             L256 420 
             Q238 410 220 420 
             L128 468 
             Q111 478 114 458 
             L131 356 
             Q134 336 120 322 
             L46 248 
             Q32 233 52 230 
             L154 214 
             Q174 210 182 190 
             Z" 
          fill="url(#goldGrad)"/>
  </g>

  <!-- Cute Star Face / Sparkle Eye Accents -->
  <circle cx="216" cy="270" r="14" fill="#58240a"/>
  <circle cx="296" cy="270" r="14" fill="#58240a"/>
  <!-- Catchlight in eyes -->
  <circle cx="212" cy="266" r="4.5" fill="#ffffff"/>
  <circle cx="292" cy="266" r="4.5" fill="#ffffff"/>
  
  <!-- Happy Cozy Smile -->
  <path d="M236 295 Q256 315 276 295" fill="none" stroke="#58240a" stroke-width="7" stroke-linecap="round"/>
  
  <!-- Cute Pink Cheeks -->
  <ellipse cx="190" cy="290" rx="12" ry="7" fill="#f43f5e" opacity="0.5"/>
  <ellipse cx="322" cy="290" rx="12" ry="7" fill="#f43f5e" opacity="0.5"/>
</svg>
